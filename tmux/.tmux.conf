set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

set -g base-index 1
set -g pane-base-index 1

bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-h select-pane -L
bind -n M-l select-pane -R

bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 2
bind -n M-Down resize-pane -D 2

# Join/break shortcuts
bind j command-prompt -p "Join pane from window:" "join-pane -s :%%"
bind b break-pane
bind m command-prompt -p "Move pane to window:" "move-pane -t :%%"

# Enable mouse support (click to select windows/panes, resize)
set -g mouse on

bind-key -n C-n display-popup -E -w 60% -h 40% "workspace_switcher"

# --- Kanagawa (wave) ---
# bg #1F1F28  bg-alt #2A2A37  border #54546D  fg #DCD7BA  dim #727169
# blue #7E9CD8  yellow #E6C384  green #98BB6C  pink #D27E99  violet #957FB8

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Status bar
set -g status-position bottom
set -g status-style "bg=#1F1F28,fg=#DCD7BA"
set -g status-left-length 30
set -g status-left "#[bg=#7E9CD8,fg=#1F1F28,bold] #S #[bg=#1F1F28] "
set -g status-right "#[fg=#727169]%d %b  #[fg=#DCD7BA]%H:%M "

# Window tabs
set -g window-status-format "#[fg=#727169] #I:#W "
set -g window-status-current-format "#[fg=#E6C384,bold] #I:#W "
set -g window-status-separator ""

# Pane borders (no headers)
set -g pane-border-status off
set -g pane-border-style "fg=#54546D"
set -g pane-active-border-style "fg=#7E9CD8"

# Messages, prompt, copy mode
set -g message-style "bg=#2A2A37,fg=#E6C384"
set -g message-command-style "bg=#2A2A37,fg=#98BB6C"
set -g mode-style "bg=#7E9CD8,fg=#1F1F28,bold"

# Pane number overlay (prefix + q) and clock
set -g display-panes-active-colour "#E6C384"
set -g display-panes-colour "#7E9CD8"
set -g clock-mode-colour "#7E9CD8"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
